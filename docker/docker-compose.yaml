services:
  backend:
    build:
      context: ../backend/KioskAPI
      dockerfile: Dockerfile
    container_name: kiosk-backend
    ports:
      - "5226:5226"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5226
      - ConnectionStrings__DefaultConnection=Data Source=/data/kiosk.db
    volumes:
      - backend_data:/data

  agent:
    build:
      context: ../agent/KioskAgent
      dockerfile: Dockerfile
    container_name: kiosk-agent
    depends_on:
      - backend
    environment:
      - Backend__BaseUrl=http://backend:5226

  frontend:
    build:
      context: ../frontend/kiosk-ui
      dockerfile: Dockerfile
    container_name: kiosk-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
